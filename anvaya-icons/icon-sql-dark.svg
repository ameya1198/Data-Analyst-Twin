<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Table border -->
  <rect x="4" y="6" width="20" height="16" rx="3" stroke="white" stroke-width="1.2" fill="none"/>
  <!-- Horizontal dividers -->
  <line x1="4"  y1="11" x2="24" y2="11" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="4"  y1="15" x2="24" y2="15" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="4"  y1="19" x2="24" y2="19" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- Vertical divider -->
  <line x1="11" y1="6"  x2="11" y2="22" stroke="white" stroke-width="1" opacity="0.4"/>
  <!-- Header row fill -->
  <rect x="4" y="6" width="20" height="5" rx="3" fill="white" opacity="0.12"/>
  <!-- Amber highlighted result row -->
  <rect x="12" y="15" width="12" height="4" rx="1" fill="#EF9F27" opacity="0.9"/>
</svg>
